<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Urenregistratie Paneelbouw</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon-64.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">URENREGISTRATIE <span>PANEELBOUW</span></div>
  <div class="top-actions">
    <button id="themeBtn" class="icon-btn" title="Thema">◐</button>
    <button id="resetBtn" class="icon-btn danger" title="Alles wissen">⌫</button>
  </div>
</header>

<main>
<section class="tabs">
  <button class="tab active" data-view="registratie">Registratie</button>
  <button class="tab" data-view="beheer">Beheer</button>
</section>

<section id="registratie" class="view active">
  <div class="card registration-card">
    <div class="section-title">Urenregistratie</div>

    <label>Project</label>
    <div class="project-row">
      <select id="projectSelect"></select>
      <button id="deleteProjectBtn" class="square danger" title="Project verwijderen">🗑</button>
    </div>

    <div class="two-col">
      <div>
        <label>Kast</label>
        <input id="kast" placeholder="VK1">
      </div>
      <div>
        <label>Positie</label>
        <input id="positie" placeholder="A01">
      </div>
    </div>

    <div class="timer-row">
      <div id="timer" class="timer">00:00:00</div>
      <button id="startBtn" class="btn start">▶ START</button>
      <button id="stopBtn" class="btn stop">■ STOP</button>
    </div>

    <div class="action-row">
      <button id="manualBtn" class="btn secondary">✎ Handmatig</button>
      <button id="noteBtn" class="btn secondary">▤ Notitie</button>
    </div>
  </div>

  <div class="card overview">
    <div class="overview-head">
      <div>Overzicht vandaag</div>
      <strong>Uren: <span id="todayHours">0:00</span></strong>
    </div>
    <div class="stats">
      <div><small>Werkdag</small><b>8:00</b></div>
      <div><small>Aanwezig</small><b id="present">0:00</b></div>
      <div><small>Pauze</small><b id="break">0:00</b></div>
    </div>
    <div id="registrationList" class="registration-list"></div>
    <button id="finishDayBtn" class="btn primary">⚑ Dag afsluiten</button>
    <button id="clearTodayBtn" class="btn secondary full">♻ Wis registraties vandaag</button>
  </div>
</section>

<section id="beheer" class="view">
  <div class="card">
    <div class="section-title">Beheer</div>
    <div class="manage-row">
      <input id="newProject" placeholder="Nieuw project">
      <button id="addProjectBtn" class="btn primary">＋ Toevoegen</button>
    </div>
    <div id="projectList" class="project-list"></div>
  </div>

  <div class="card">
    <div class="section-title">Overzicht</div>
    <div class="manage-grid">
      <button id="weekBtn" class="btn secondary">Week</button>
      <button id="monthBtn" class="btn secondary">Maand</button>
      <button id="printBtn" class="btn secondary">🖨 Print</button>
      <button id="exportBtn" class="btn secondary">⇩ Export</button>
    </div>
    <div id="summary" class="summary"></div>
  </div>
</section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
